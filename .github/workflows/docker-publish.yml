name: Build and Publish QuantamDX

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify model files
        run: |
          ls -lh app/models/
          test -s app/models/efficientnet_b0_best.pth
          test -s app/models/efficientnet_b3_backbone.pth
          test -s app/models/resnet50_best.pth
          test -s app/models/hybrid_safe_vqc_FINAL.pth
          test -s app/models/supervised_projection_8d_NEW.pth
          test -s app/models/cnn_feature_scaler.pkl

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vikasachar27-jpg/quantamdx:latest
          labels: |
            org.opencontainers.image.source=https://github.com/vikasachar27-jpg/QuantamDX